<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What We Eating? by Wavelord</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <button id="skipBtn" onclick="enterApp()">Skip ›</button>

  <div class="steam">
    <span></span><span></span><span></span>
  </div>

  <div class="burger">
    <div class="bun-top"></div>
    <div class="tomato"></div>
    <div class="lettuce"></div>
    <div class="cheese"></div>
    <div class="patty"></div>
    <div class="bun-bottom"></div>
  </div>

  <h1>WHAT WE<br>EATING?</h1>
  <p class="by">BY WAVELORD</p>

  <button id="tapBtn" onclick="enterApp()">TAP TO EAT 🍔</button>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <header>
    <h2>🍔 What We Eating?</h2>
    <p>Find your next meal in Trinidad & Tobago</p>
  </header>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search doubles, roti, bake & shark..." />
    <button onclick="searchFood()">Search</button>
  </div>

  <div id="results"></div>
</div>

<script src="app.js"></script>
</body>
</html>
