name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK - use preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK is at: $ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build www - BEFORE cap sync
        run: |
          mkdir -p www www/assets
          cp index.html app.js style.css manifest.json sw.js www/ || true
          cp icon-192.png icon-512.png www/ 2>/dev/null || true
          cp assets/icon-192.png assets/icon-512.png www/ 2>/dev/null || true
          cp -r assets/* www/assets/ 2>/dev/null || true
          echo "--- www/ proof ---"
          ls -lh www/ www/assets/ || true
          test -f www/index.html || (echo "index.html missing in www/" && exit 1)

      - name: Capacitor sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate launcher icons - MIPMAP ONLY, NO DRAWABLE
        run: |
          SRC="icon-512.png"
          if [ ! -f "$SRC" ]; then SRC="assets/icon-512.png"; fi
          echo "Using icon source: $SRC"
          ls -lh "$SRC"
          file "$SRC"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p android/app/src/main/res/mipmap-$density
            convert "$SRC" -strip -resize ${size}x${size} -define png:format=png32 android/app/src/main/res/mipmap-$density/ic_launcher.png
            convert "$SRC" -strip -resize ${size}x${size} -define png:format=png32 android/app/src/main/res/mipmap-$density/ic_launcher_round.png
            convert "$SRC" -strip -resize ${size}x${size} -define png:format=png32 android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png
          done
          echo "--- delete any drawable icons ---"
          rm -f android/app/src/main/res/drawable/ic_launcher.png android/app/src/main/res/drawable/ic_launcher_round.png android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml || true
          find android/app/src/main/res -type d -name "drawable*" -exec rm -rf {} + 2>/dev/null || true
          echo "--- mipmap proof ---"
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ || true
          ls android/app/src/main/res/ || true

      - name: Apply overlay - AFTER cap sync + icons
        run: |
          mkdir -p android/app/src/main/java/com/wavelord/whatweeating
          cp overlay/MainActivity.java android/app/src/main/java/com/wavelord/whatweeating/MainActivity.java
          cp overlay/FloatingBuddy.java android/app/src/main/java/com/wavelord/whatweeating/FloatingBuddy.java
          cp overlay/FloatingBuddyService.java android/app/src/main/java/com/wavelord/whatweeating/FloatingBuddyService.java
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "--- overlay proof ---"
          ls -lh android/app/src/main/java/com/wavelord/whatweeating/
          grep -q "FloatingBuddyService" android/app/src/main/AndroidManifest.xml && echo "Manifest has Buddy service OK" || (echo "Manifest missing Buddy service" && exit 1)
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml && echo "Manifest icon OK" || echo "WARNING: Manifest icon not mipmap"

      - name: Build APK - LAST, Debug = installable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: What-We-Eating-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
