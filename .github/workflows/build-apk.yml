name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK - use preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK is at: $ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build www folder
        run: |
          mkdir -p www www/assets
          cp index.html www/
          cp app.js www/ || true
          cp style.css www/ || true
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp icon-512.png www/ || true
          cp icon-192.png www/ || true
          cp icon-512.png www/assets/icon-512.png || true
          cp icon-192.png www/assets/icon-192.png || true
          cp -r assets/* www/assets/ 2>/dev/null || true
          ls -lh www/ www/assets/

      - name: Capacitor add + sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Android launcher icons - MIPMAP ONLY, NO DRAWABLE
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          SRC="icon-512.png"
          if [ ! -f "$SRC" ]; then SRC="assets/icon-512.png"; fi
          echo "Using icon source: $SRC"
          file "$SRC"
          ls -lh "$SRC"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p android/app/src/main/res/mipmap-$density
            convert "$SRC" -strip -resize ${size}x${size} -define png:format=png32 android/app/src/main/res/mipmap-$density/ic_launcher.png
            convert "$SRC" -strip -resize ${size}x${size} -define png:format=png32 android/app/src/main/res/mipmap-$density/ic_launcher_round.png
            convert "$SRC" -strip -resize ${size}x${size} -define png:format=png32 android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png
            file android/app/src/main/res/mipmap-$density/ic_launcher.png
          done
          echo "DELETE any bad drawable icon - this is what killed the last build"
          rm -f android/app/src/main/res/drawable/ic_launcher.png
          rm -f android/app/src/main/res/drawable/ic_launcher_round.png
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          echo "PROOF - drawable must NOT have ic_launcher:"
          ls -lh android/app/src/main/res/drawable/ || echo "no drawable folder - good"
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/

      - name: Apply overlay - YOUR real layout
        run: |
          ls -lh AndroidManifest.xml
          ls -lh overlay/
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/wavelord/whatweeating
          cp overlay/*.java android/app/src/main/java/com/wavelord/whatweeating/
          ls -lh android/app/src/main/AndroidManifest.xml
          ls -lh android/app/src/main/java/com/wavelord/whatweeating/
          grep -n "android:icon" android/app/src/main/AndroidManifest.xml || echo "WARNING: No android:icon in manifest"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          echo "=== WHAT DID GRADLE ACTUALLY MAKE? ==="
          find app/build -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: what-we-eating-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
