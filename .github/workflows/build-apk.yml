name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Export SDK + accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install deps
        run: npm install

      - name: Kill TypeScript config - use JS only
        run: |
          rm -f capacitor.config.ts
          ls -lh capacitor.config.* || true
          test -f capacitor.config.js || (echo "capacitor.config.js MISSING - add it" && exit 1)

      - name: Build www/
        run: |
          mkdir -p www www/assets
          cp index.html app.js style.css manifest.json sw.js www/ || true
          cp icon-192.png icon-512.png www/ || true
          cp -r assets/* www/assets/ 2>/dev/null || true
          test -f www/index.html || (echo "index.html missing in www/" && exit 1)

      - name: Capacitor sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply overlay + manifest + icons
        run: |
          mkdir -p android/app/src/main/java/com/wavelord/whatweeating
          cp overlay/MainActivity.java android/app/src/main/java/com/wavelord/whatweeating/MainActivity.java
          cp overlay/FloatingBuddy.java android/app/src/main/java/com/wavelord/whatweeating/FloatingBuddy.java
          cp overlay/FloatingBuddyService.java android/app/src/main/java/com/wavelord/whatweeating/FloatingBuddyService.java
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -q "FloatingBuddyService" android/app/src/main/AndroidManifest.xml && echo "Manifest has Buddy service OK" || (echo "Manifest missing Buddy service" && exit 1)
          find android/app/src/main/res -type d -name "drawable*" -exec rm -rf {} + 2>/dev/null || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: What-We-Eating-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
